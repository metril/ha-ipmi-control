force_power_off:
  name: Force power off
  description: >-
    Immediately cut power to an IPMI host (hard power off), bypassing a
    graceful shutdown. Requires the host to be armed first via its
    "Power Off (Arm)" switch, unless confirm is set to true.
  fields:
    entity_id:
      name: Entity
      description: The force power off button entity of the target host.
      required: true
      selector:
        entity:
          domain: button
    confirm:
      name: Confirm
      description: >-
        Set to true to execute immediately without requiring the host to be
        pre-armed via its "Power Off (Arm)" switch.
      required: true
      selector:
        boolean:

bmc_cold_reset:
  name: BMC cold reset
  description: >-
    Reboot the BMC (baseboard management controller) itself, leaving the server
    powered as-is. Requires Administrator credentials, and requires the host to
    be armed first via its "BMC Reset (Arm)" switch unless confirm is set to
    true. The BMC drops all IPMI sessions and is unreachable for roughly a
    minute afterwards.
  fields:
    entity_id:
      name: Entity
      description: The BMC cold reset button entity of the target host.
      required: true
      selector:
        entity:
          domain: button
    confirm:
      name: Confirm
      description: >-
        Set to true to execute immediately without requiring the host to be
        pre-armed via its "BMC Reset (Arm)" switch.
      required: true
      selector:
        boolean:
