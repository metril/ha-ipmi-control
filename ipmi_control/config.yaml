name: "IPMI Control"
version: "2.4.0"
slug: "ipmi_control"
image: ghcr.io/metril/ha-ipmi-control-{arch}
description: "IPMI/BMC management proxy for Home Assistant"
url: "https://github.com/metril/ha-ipmi-control"
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
host_network: false
ports:
  8099/tcp: null
ports_description:
  8099/tcp: API for the IPMI Control integration (leave empty to keep internal-only)
options:
  max_concurrent: 8
schema:
  max_concurrent: int(1,32)
